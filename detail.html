<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Details - Country Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Country Explorer</h1>
    </header>

    <main>
        <a href="index.html" class="back-button">
            &larr; Back to Countries
        </a>

        <section id="country-details" class="details-container">

            <div class="details-flag">
                <img id="country-flag" src="" alt="Country flag">
            </div>

            <div class="details-info">
                <h2 id="country-name"></h2>

                <p>
                    <strong>Official Name:</strong>
                    <span id="official-name"></span>
                </p>

                <p>
                    <strong>Population:</strong>
                    <span id="country-population"></span>
                </p>

                <p>
                    <strong>Region:</strong>
                    <span id="country-region"></span>
                </p>

                <p>
                    <strong>Subregion:</strong>
                    <span id="country-subregion"></span>
                </p>

                <p>
                    <strong>Capital:</strong>
                    <span id="country-capital"></span>
                </p>

                <p>
                    <strong>Currencies:</strong>
                    <span id="country-currencies"></span>
                </p>

                <p>
                    <strong>Languages:</strong>
                    <span id="country-languages"></span>
                </p>
            </div>

        </section>
    </main>

    <script src="detail.js"></script>
</body>

</html>
